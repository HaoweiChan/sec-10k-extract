<!-- S8 regression fixture, UI half. Two client-side ways the "exclude
     boilerplate" wire breaks silently, while every OTHER call site stays
     correctly wired so the check has to distinguish rather than blanket-fail:

       1. the checkbox ships `checked`, so the deployed inspector no longer
          shows today's behaviour by default — the one thing ADR-026 promises
          every existing caller.
       2. the fixture mode hardcodes `exclude_boilerplate: true` instead of
          reading the checkbox, so that mode excludes on EVERY request no
          matter what the box says (PR #27 R2 shape b). Unticking the box
          then changes nothing, which is the same broken promise arriving
          from the opposite direction.

     The url and upload sites below are correct here on purpose: their
     handlers in boilerplate-wire-broken.py are the mutated end, and the
     check has to notice the two ends disagreeing rather than notice a
     missing mention. Caught by
     evals/adversarial/ui-boilerplate-exclusion-regression.json
     (expect.min_failures/max_failures). -->
<label><input type="checkbox" id="exclude-bp" checked> exclude boilerplate</label>
<script>
function excludeBp(){ const c = $("#exclude-bp"); return !!(c && c.checked); }
$("#go-fx").onclick = () => call("/api/extract/fixture",
  {method:"POST", headers:{"Content-Type":"application/json"},
   body: JSON.stringify({fixture: $("#fx").value, exclude_boilerplate: true})});
$("#go-url").onclick = () => call("/api/extract/url",
  {method:"POST", headers:{"Content-Type":"application/json"},
   body: JSON.stringify({url: $("#url").value, exclude_boilerplate: excludeBp()})});
$("#go-up").onclick = () => {
  const f = $("#up").files[0];
  call("/api/extract/upload?filename=" + encodeURIComponent(f.name) +
       (excludeBp() ? "&exclude_boilerplate=1" : ""),
       {method:"POST", body: f});
};
</script>
