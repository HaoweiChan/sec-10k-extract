name: eval-gate

# The same three commands the pre-commit hook and a human would run. Job names
# are the contract with branch protection — renaming one silently disables the
# required check, so they are not cosmetic.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # the floor declared in pyproject, so CI tests it
      # no pip install: the extraction pipeline and the eval harness are
      # stdlib-only by decision (ADR-003). fastapi/uvicorn are needed by the
      # web layer alone and nothing under test imports them. If a dependency
      # ever creeps into this path, this job fails on the import — which is
      # the cheapest possible enforcement of that decision.
      - run: python3 -m src.sec10k.test_eval_adapter
      - run: python3 -m src.sec10k.normalize
      - run: python3 -m src.sec10k.segment
      - run: python3 -m src.sec10k.validate
      # ADR-026 names this self-check as an "Enforced by" artifact, and PR #25
      # R1 measured what that was worth while it was absent here: MIN_REPEATS
      # 8->20, MIN_SPREAD 0.70->0.95, PAGE_DIGITS 3->4 and a no-op strip_chrome
      # all left the eval gate 33/33 and 74/74 green with only _demo red, and
      # nothing automated ran _demo. A self-check no job runs is a claim, not
      # enforcement.
      - run: python3 -m src.sec10k.boilerplate
      # ADR-029 names this one the same way (the derived grid/Markdown views)
      - run: python3 -m src.sec10k.tables
      # ADR-032 names this one the same way (the derived Markdown view)
      - run: python3 -m src.sec10k.markdown
      # the view layer imports no fastapi, precisely so it can run here
      - run: python3 -m src.sec10k.web.view
      # ADR-036 names both of these "Enforced by", and PR #58 R3 measured what
      # that was worth while they were absent here: replacing the SPAN_FLOOR,
      # SIM_FLOOR and INV-S1 guards in `escalate.verify` AND both `Budget`
      # ceilings with `if False:` left invariant 75/75 and fast 138/138 fully
      # green — every trust boundary and the entire money ceiling deletable
      # with the gate silent (tasks/reviews/pr58-r1-red.txt). Same ruling as
      # PR #25 R1 six lines up: a self-check no job runs is a claim, not
      # enforcement. `escalate` imports `llm` only inside route(), and neither
      # self-check makes a call, so this job stays stdlib-only and $0.
      - run: python3 -m src.sec10k.escalate
      - run: python3 -m src.sec10k.llm
      - run: python3 -m evals.metrics --self-check
      # ADR-033 §d: the snapshot comparison that proves an opt-in annotation
      # moved nothing is only re-runnable if the script itself is checked
      - run: python3 evals/snapshot.py --self-check
      # ADR-021 names both of these "Enforced by" artifacts too, and PR #12 R27
      # found neither wired anywhere (D2). --check-docs reads the bench
      # artifact of record named in ADR-021's header — fails closed on a
      # vacuous run and on a missing DOC_FILES entry. Same path as
      # .githooks/pre-commit; move them together.
      - run: python3 -m evals.bench --self-check
      - run: python3 -m evals.bench --check-docs evals/report/20260823-185707-bench.json

  invariant-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # invariants are absolute: the runner requires 100%, no baseline involved
      - run: python3 -m evals.run --suite invariant

  fast-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # compares against .eval-baseline.json — the same gate as .githooks/pre-commit.
      # --report (ADR-025): this is the report-of-record run for main at head,
      # so it writes the full per-case report even though the gate is green.
      - run: python3 -m evals.run --suite fast --report
